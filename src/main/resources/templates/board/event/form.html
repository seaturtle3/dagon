<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${eventId != null} ? '이벤트 수정' : '이벤트 작성'">이벤트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="container">
    <h1 class="page-title" th:text="${eventId != null} ? '이벤트 수정' : '이벤트 작성'">이벤트</h1>

    <form th:action="@{${formAction}}" th:object="${eventForm}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="page" th:value="${page}">
        <input type="hidden" name="size" th:value="${size}">
        <input type="hidden" id="currentEventId" th:value="${eventId}">

        <div class="form-group">
            <label>제목</label>
            <input type="text" th:field="*{title}" placeholder="제목">
        </div>

        <div class="form-group">
            <label><input type="checkbox" th:field="*{isTop}"> 상단 고정</label>
        </div>

        <div class="form-group">
            <label>시작일</label>
            <input type="date" th:field="*{startAt}">

            <label>종료일</label>
            <input type="date" th:field="*{endAt}">
        </div>

        <div class="form-group">
            <label>내용</label>
            <textarea id="summernote" th:field="*{content}"></textarea>
        </div>

        <div id="thumbnailSelector" class="form-group">
            <p>썸네일로 사용할 이미지를 선택하세요:</p>
            <div id="thumbnailOptions"></div>
            <input type="hidden" th:field="*{thumbnailUrl}" id="thumbnailUrl">
        </div>

        <div class="form-group">
            <label>이벤트 이미지 업로드</label>
            <input type="file" name="images" multiple>
        </div>

        <div class="button-group text-end">
            <button type="submit" class="btn btn-custom" th:text="${eventId != null} ? '수정 완료' : '등록'">등록</button>
            <a th:href="@{'/admin/dashboard'}" class="btn btn-secondary">목록으로</a>
        </div>
    </form>
</div>

<script>
    $(document).ready(function () {
        const summernote = $('#summernote');
        let currentEventId = null;

        // 이벤트 수정 시 기존 eventId 사용
        if (document.getElementById('currentEventId').value) {
            currentEventId = document.getElementById('currentEventId').value;
        }

        summernote.summernote({
            placeholder: '내용을 입력하세요...',
            height: 300,
            callbacks: {
                onImageUpload: function (files) {
                    // 이벤트가 아직 생성되지 않은 경우 경고
                    if (!currentEventId) {
                        alert("이미지를 업로드하려면 먼저 이벤트를 저장해주세요.");
                        return;
                    }

                    let formData = new FormData();
                    formData.append("file", files[0]);
                    formData.append("eventId", currentEventId);

                    axios.post("/api/images/uploadImage", formData, {
                        headers: {'Content-Type': 'multipart/form-data'}
                    }).then(res => {
                        summernote.summernote('insertImage', res.data);
                    }).catch(err => {
                        console.error("이미지 업로드 실패:", err);
                        alert("이미지 업로드 실패: " + (err.response?.data || err.message));
                    });
                }
            }
        });

        function updateThumbnailOptions() {
            const content = summernote.summernote('code');
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = content;

            const images = tempDiv.querySelectorAll("img");
            const container = document.getElementById("thumbnailOptions");
            container.innerHTML = "";

            images.forEach((img, idx) => {
                const url = img.getAttribute("src");
                const label = document.createElement("label");
                label.innerHTML = `
                    <input type="radio" name="thumbnail" value="${url}" ${idx === 0 ? "checked" : ""}>
                    <img src="${url}" width="100">
                `;
                container.appendChild(label);
            });

            const first = container.querySelector("input[type=radio]");
            if (first) document.getElementById("thumbnailUrl").value = first.value;

            container.addEventListener("change", (e) => {
                if (e.target.name === "thumbnail") {
                    document.getElementById("thumbnailUrl").value = e.target.value;
                }
            });
        }

        summernote.on('summernote.change', updateThumbnailOptions);
        setTimeout(updateThumbnailOptions, 300);

        // 폼 제출 시 eventId 업데이트 (새 이벤트 생성 후)
        $('form').on('submit', function(e) {
            // 새 이벤트 생성인 경우, 제출 후 eventId를 받아서 업데이트
            if (!currentEventId) {
                // AJAX로 제출하여 응답에서 eventId 받기
                e.preventDefault();
                
                let formData = new FormData(this);
                
                axios.post($(this).attr('action'), formData, {
                    headers: {'Content-Type': 'multipart/form-data'}
                }).then(res => {
                    if (res.data && res.data.eventId) {
                        currentEventId = res.data.eventId;
                        document.getElementById('currentEventId').value = currentEventId;
                        alert("이벤트가 성공적으로 저장되었습니다. 이제 이미지를 업로드할 수 있습니다.");
                        // 페이지 새로고침하여 수정 모드로 전환
                        window.location.reload();
                    }
                }).catch(err => {
                    console.error("이벤트 저장 실패:", err);
                    alert("이벤트 저장 실패: " + (err.response?.data || err.message));
                });
            }
        });
    });
</script>

</body>
</html>
